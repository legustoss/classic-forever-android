name: Bug report
description: Something in the launcher or game session is broken
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach credentials, keystores or `.build.info` from a private install.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "0.1.1"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device / SoC / Android
      placeholder: "AYN Odin 2, Snapdragon 8 Gen 2, Android 14"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Paste relevant parts of logs/app.log and logs/classic-forever.log"
      render: shell
