name: Feature request
description: Suggest an improvement to the launcher
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: "What is difficult or missing today?"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not add anti-cheat bypasses, cheats or game-memory changes outside ClassicForeverPatcher.kt
          required: true
        - label: This does not require a new dependency without justification
          required: true
